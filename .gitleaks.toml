# Ergänzt die Standardregeln, ersetzt sie nicht.
[extend]
useDefault = true

[allowlist]
description = "Bekannte Fehlalarme"
# Caddys `ask`-Adresse (Caddyfile.tls): ein interner Dienstname mit Port, kein
# Schlüssel. Die Regel generic-api-key hält "api:3001" dafür. Bewusst auf genau
# diese Zeile beschränkt, damit echte Funde in derselben Datei weiter anschlagen.
regexes = ['''ask http://api:3001/api/tls/erlaubt''']
