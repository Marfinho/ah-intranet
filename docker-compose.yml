services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ah_intranet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ah_intranet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ah_intranet?schema=public
      FRONTEND_URL: http://localhost:3000
      # Für den Produktivbetrieb durch ein Secret ersetzen.
      JWT_SECRET: bitte-aendern-langer-zufallswert
      JWT_EXPIRES_IN: 12h
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      # Server Components sprechen die API im Docker-Netz direkt an.
      API_URL: http://api:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
