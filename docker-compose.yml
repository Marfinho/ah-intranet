services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ah_intranet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Nur auf dem eigenen Rechner erreichbar. Ohne die Bindung an 127.0.0.1
      # hängt die Datenbank mit `postgres/postgres` am Netz, sobald jemand
      # diese Datei auf einem Server mit öffentlicher Adresse startet.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ah_intranet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ah_intranet?schema=public
      FRONTEND_URL: http://localhost:3000
      # Kein Standardwert: `:?` bricht den Start ab, wenn nichts gesetzt ist.
      # Vorher stand hier ein Beispielwert, mit dem die Anwendung anstandslos
      # lief - und mit dem sich jede Sitzung fälschen ließe, weil er im
      # Repository nachzulesen ist. Erzeugen mit `openssl rand -base64 48`.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss gesetzt sein - siehe docs/betrieb.md}
      JWT_EXPIRES_IN: 12h
      # Ohne diesen Schlüssel lassen sich keine Geheimnisse hinterlegen; die
      # Anwendung läuft, weist das Speichern aber ab.
      SECRET_KEY: ${SECRET_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      # Server Components sprechen die API im Docker-Netz direkt an.
      API_URL: http://api:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
